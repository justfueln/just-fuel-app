<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0b" />
    <meta name="description" content="Just Fuel training, race, fueling and ordering app" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Just Fuel" />
    <link rel="preconnect" href="https://ufolqntrfmvefpvrjnsa.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://ufolqntrfmvefpvrjnsa.supabase.co" />
    <link rel="manifest" href="/manifest.webmanifest?v=16" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <title>Just Fuel</title>
    <style>
      html,body,#root{min-height:100%;}
      body{margin:0;background:#f6f6f3;color:#111;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
      .jf-boot{min-height:100vh;box-sizing:border-box;display:flex;flex-direction:column;background:#f6f6f3;}
      .jf-boot-head{background:#0b0b0b;color:#fff;padding:max(18px,env(safe-area-inset-top)) 20px 17px;box-sizing:border-box;}
      .jf-boot-brand{font-size:22px;font-weight:900;letter-spacing:.11em;line-height:1;}
      .jf-boot-sub{margin-top:6px;font-size:10px;font-weight:700;letter-spacing:.13em;opacity:.7;}
      .jf-boot-main{flex:1;padding:24px 18px 96px;box-sizing:border-box;max-width:720px;width:100%;margin:0 auto;}
      .jf-boot-kicker{font-size:12px;font-weight:800;letter-spacing:.12em;color:#70706c;}
      .jf-boot-title{margin:8px 0 18px;font-size:30px;line-height:1.08;font-weight:850;}
      .jf-boot-card{height:170px;border-radius:22px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.06);position:relative;overflow:hidden;}
      .jf-boot-card:before,.jf-boot-card:after,.jf-boot-line{content:"";position:absolute;left:18px;right:18px;height:14px;border-radius:8px;background:#ecece8;}
      .jf-boot-card:before{top:24px;right:42%;}.jf-boot-card:after{top:54px;right:18%;}.jf-boot-line{top:88px;right:28%;}
      .jf-boot-nav{position:fixed;z-index:2;left:0;right:0;bottom:0;height:74px;padding-bottom:env(safe-area-inset-bottom);box-sizing:content-box;background:#fff;border-top:1px solid #e7e7e2;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;text-align:center;font-size:10px;font-weight:750;color:#6e6e69;}
      .jf-boot-nav span:first-child{color:#111;}
      @media (prefers-reduced-motion:no-preference){.jf-boot-card:after,.jf-boot-line{animation:jfboot 1.15s ease-in-out infinite alternate}@keyframes jfboot{to{opacity:.45}}}
    </style>
    <script>
      window.__JF_CURRENT_APP_VERSION__='16';
      if ('serviceWorker' in navigator) {
        (async () => {
          try {
            const url = new URL(window.location.href);
            const cleared = url.searchParams.get('legacy') === 'cleared' && url.searchParams.get('jfapp') === '16';
            const registrations = await navigator.serviceWorker.getRegistrations();
            if (!cleared && (registrations.length || navigator.serviceWorker.controller)) {
              const retirement = await navigator.serviceWorker.register('/sw.js?retire=16', { scope: '/', updateViaCache: 'none' });
              try { await retirement.update(); } catch {}
              try { retirement.waiting?.postMessage('JF_FORCE_ACTIVATE'); } catch {}
              try { retirement.installing?.postMessage('JF_FORCE_ACTIVATE'); } catch {}
            }
          } catch {}
        })();
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div class="jf-boot" aria-label="Loading Just Fuel">
        <div class="jf-boot-head"><div class="jf-boot-brand">JUST FUEL</div><div class="jf-boot-sub">FUEL SMART • TRAIN HARD</div></div>
        <main class="jf-boot-main"><div class="jf-boot-kicker">TODAY</div><div class="jf-boot-title">Loading your day…</div><div class="jf-boot-card"><div class="jf-boot-line"></div></div></main>
        <nav class="jf-boot-nav" aria-hidden="true"><span>Home</span><span>Training</span><span>Race</span><span>Fuel</span><span>Shop</span></nav>
      </div>
    </div>
    <script type="module" src="/src/main.jsx?v=16"></script>
  </body>
</html>
