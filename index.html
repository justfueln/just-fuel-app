<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0b" />
    <meta name="description" content="Just Fuel fuel planner, shop, training and race app" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Just Fuel" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Just Fuel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      const fixOtpField = () => {
        const input = document.querySelector('input[inputmode="numeric"][maxlength="6"]');
        if (input) {
          input.maxLength = 10;
          input.placeholder = 'Login code';
        }
        document.querySelectorAll('button').forEach((button) => {
          if (button.textContent.trim() === 'Send 6-digit code') button.textContent = 'Send login code';
        });
      };
      new MutationObserver(fixOtpField).observe(document.documentElement, { childList: true, subtree: true });
      window.addEventListener('DOMContentLoaded', fixOtpField);
    </script>
  </body>
</html>
