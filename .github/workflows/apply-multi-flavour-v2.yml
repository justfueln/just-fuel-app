name: Apply multi flavour fuel planner v2

on:
  push:
    branches:
      - fuel-multi-flavour
    paths:
      - .github/workflows/apply-multi-flavour-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Fix patch expression
        run: python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-multi-flavour.mjs')
          s=p.read_text()
          s=s.replace("Number(boostByHorizon[horizon]??tally.boost||0)","Number(boostByHorizon[horizon] ?? tally.boost ?? 0)")
          p.write_text(s)
          PY
      - name: Apply multi flavour patch
        run: node scripts/apply-multi-flavour.mjs
      - name: Run unit tests
        run: npm test
      - name: Build production app
        run: npm run build
      - name: Commit planner update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppV3.jsx src/season-v3.css
          git commit -m "Allow multi-flavour fuel planning"
          git push origin HEAD:fuel-multi-flavour
