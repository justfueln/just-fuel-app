name: Apply app polish phase 5

on:
  push:
    branches:
      - app-polish-phase-5
    paths:
      - '.github/workflows/apply-polish-phase5.yml'
      - 'scripts/apply-polish-phase5.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out phase 5 branch
        uses: actions/checkout@v4
        with:
          ref: app-polish-phase-5
          fetch-depth: 0

      - name: Apply source changes
        run: node scripts/apply-polish-phase5.mjs

      - name: Commit generated changes
        run: |
          if git diff --quiet -- src/ShellNextV3.jsx src/AppV3.jsx src/app-polish-v5.css; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ShellNextV3.jsx src/AppV3.jsx src/app-polish-v5.css
          git commit -m "Improve navigation, basket persistence and Training loading [skip ci]"
          git push origin app-polish-phase-5
