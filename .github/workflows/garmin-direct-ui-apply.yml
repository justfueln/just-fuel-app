name: Apply Garmin direct sync UI

on:
  push:
    branches:
      - garmin-direct-sync-ui
    paths:
      - scripts/apply-garmin-direct-ui.mjs
      - .github/workflows/garmin-direct-ui-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Apply Garmin UI patch
        run: node scripts/apply-garmin-direct-ui.mjs
      - name: Run unit tests
        run: npm test
      - name: Build production app
        run: npm run build
      - name: Commit Garmin UI
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/training-workout-details.js
          git commit -m "Simplify Garmin workout delivery UI"
          git push origin HEAD:garmin-direct-sync-ui
