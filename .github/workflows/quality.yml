name: Quality checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Verify built PWA recovery routes
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/current/index.html
          test -f dist/legacy-reset.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          grep -q "__JF_CURRENT_APP_VERSION__='16'" dist/index.html
          grep -q "jfapp', '16'" dist/current/index.html
          grep -q 'just-fuel-current-v16' dist/manifest.webmanifest
          grep -q "CURRENT_APP_VERSION = '16'" dist/sw.js

  browser-regression:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production app
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser regression tests
        run: npm run test:e2e

  production-smoke:
    if: github.event_name == 'push'
    needs: [build-and-test, browser-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for Vercel production and verify live routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://app.justfuelnutrition.co.za'
          ok=0
          for attempt in 1 2 3 4 5 6; do
            echo "Production smoke attempt ${attempt}/6"
            if curl -fsSL --max-time 20 "$base/?jfapp=16&legacy=cleared&ci=$GITHUB_SHA" -o /tmp/jf-root.html \
              && curl -fsSL --max-time 20 "$base/current/?jfapp=16&legacy=cleared&ci=$GITHUB_SHA" -o /tmp/jf-current.html \
              && curl -fsSL --max-time 20 "$base/manifest.webmanifest?ci=$GITHUB_SHA" -o /tmp/jf-manifest.json \
              && curl -fsSL --max-time 20 "$base/legacy-reset.html?v=16&ci=$GITHUB_SHA" -o /tmp/jf-reset.html \
              && grep -q "__JF_CURRENT_APP_VERSION__='16'" /tmp/jf-root.html \
              && grep -q 'just-fuel-current-v16' /tmp/jf-manifest.json \
              && grep -q 'Just Fuel' /tmp/jf-current.html \
              && grep -q 'CURRENT' /tmp/jf-reset.html; then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo 'Production smoke failed. Root/current/manifest/reset did not all match the v16 app.' >&2
            echo '--- root ---' >&2
            sed -n '1,60p' /tmp/jf-root.html 2>/dev/null >&2 || true
            echo '--- current ---' >&2
            sed -n '1,60p' /tmp/jf-current.html 2>/dev/null >&2 || true
            exit 1
          fi

  production-browser-smoke:
    if: github.event_name == 'push'
    needs: production-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify live production in Chromium
        env:
          JF_PRODUCTION_SMOKE: '1'
          JF_PRODUCTION_URL: https://app.justfuelnutrition.co.za
        run: npx playwright test tests/e2e/production-live.spec.js --project=mobile-chromium --reporter=line
