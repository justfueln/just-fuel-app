name: Apply app polish phase 6

on:
  push:
    branches:
      - app-polish-phase-6
    paths:
      - '.github/workflows/apply-polish-phase6.yml'
      - 'scripts/apply-polish-phase6.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out phase 6 branch
        uses: actions/checkout@v4
        with:
          ref: app-polish-phase-6
          fetch-depth: 0

      - name: Apply source changes
        run: node scripts/apply-polish-phase6.mjs

      - name: Commit generated changes
        run: |
          if git diff --quiet -- src/ShellNextV3.jsx; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ShellNextV3.jsx
          git commit -m "Extract and improve checkout flow [skip ci]"
          git push origin app-polish-phase-6
