name: Apply gel boost inline

on:
  push:
    branches: [gel-boost-inline]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Apply inline gel patch
        run: node scripts/apply-gel-boost-inline.mjs
      - name: Run unit tests
        run: npm test
      - name: Build production app
        run: npm run build
      - name: Commit app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/AppV3.jsx src/season-v3.css
          git commit -m 'Move Boost selection into gel flavours'
          git push
