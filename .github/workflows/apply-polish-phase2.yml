name: Apply app polish phase 2

on:
  push:
    branches:
      - app-polish-phase-2
    paths:
      - '.github/workflows/apply-polish-phase2.yml'
      - 'scripts/apply-polish-phase2.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out polish branch
        uses: actions/checkout@v4
        with:
          ref: app-polish-phase-2
          fetch-depth: 0

      - name: Apply source changes
        run: node scripts/apply-polish-phase2.mjs

      - name: Commit generated changes
        run: |
          if git diff --quiet -- src/AppV3.jsx; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppV3.jsx
          git commit -m "Polish Training overview and Strava sync [skip ci]"
          git push origin app-polish-phase-2
