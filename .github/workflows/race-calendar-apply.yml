name: Apply race calendar integration

on:
  push:
    branches:
      - race-calendar-clean
    paths:
      - scripts/apply-race-calendar.mjs
      - .github/workflows/race-calendar-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply race calendar integration
        run: node scripts/apply-race-calendar.mjs
      - name: Run unit tests
        run: npm test
      - name: Build production app
        run: npm run build
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppV3.jsx src/season-v3.css
          git commit -m "Apply race calendar integration"
          git push origin HEAD:race-calendar-clean
