name: Fix phase 8 shell

on:
  push:
    branches:
      - app-polish-phase-8
    paths:
      - '.github/workflows/fix-phase8-shell.yml'
      - 'scripts/fix-phase8-shell.mjs'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app-polish-phase-8
          fetch-depth: 0
      - run: git fetch origin main
      - run: node scripts/fix-phase8-shell.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ShellNextV3.jsx
          git commit -m "Repair phase 8 shell extraction [skip ci]"
          git push origin app-polish-phase-8
