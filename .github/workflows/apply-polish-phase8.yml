name: Apply app polish phase 8

on:
  push:
    branches:
      - app-polish-phase-8
    paths:
      - '.github/workflows/apply-polish-phase8.yml'
      - 'scripts/apply-polish-phase8.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out phase 8 branch
        uses: actions/checkout@v4
        with:
          ref: app-polish-phase-8
          fetch-depth: 0

      - name: Apply refactor
        run: node scripts/apply-polish-phase8.mjs

      - name: Commit generated changes
        run: |
          if git diff --quiet -- src/ShellNextV3.jsx src/AppV3.jsx; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ShellNextV3.jsx src/AppV3.jsx
          git commit -m "Extract reminder UI and Training data service [skip ci]"
          git push origin app-polish-phase-8
