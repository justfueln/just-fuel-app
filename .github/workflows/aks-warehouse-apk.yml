name: Build AKS Warehouse APK

on:
  push:
    branches:
      - aks-warehouse-apk-build
    paths:
      - 'aks-warehouse-android/**'
      - '.github/workflows/aks-warehouse-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: aks-warehouse-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp aks-warehouse-android/app/build/outputs/apk/debug/app-debug.apk 'AKS-Warehouse-Stock.apk'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AKS-Warehouse-Stock-APK
          path: AKS-Warehouse-Stock.apk
          if-no-files-found: error
