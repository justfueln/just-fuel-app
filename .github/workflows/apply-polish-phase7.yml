name: Apply app polish phase 7

on:
  push:
    branches:
      - app-polish-phase-7
    paths:
      - '.github/workflows/apply-polish-phase7.yml'
      - 'scripts/apply-polish-phase7.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out phase 7 branch
        uses: actions/checkout@v4
        with:
          ref: app-polish-phase-7
          fetch-depth: 0

      - name: Extract commerce pages
        run: node scripts/apply-polish-phase7.mjs

      - name: Commit generated changes
        run: |
          if git diff --quiet -- src/ShellNextV3.jsx src/CommercePages.jsx; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ShellNextV3.jsx src/CommercePages.jsx
          git commit -m "Extract commerce pages from shell [skip ci]"
          git push origin app-polish-phase-7
