<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0b" />
  <title>Updating Just Fuel</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080808;color:#f6f1e7;display:grid;place-items:center;padding:28px}
    main{width:min(440px,100%);border:1px solid #4d421f;border-radius:26px;padding:30px;background:#0e0e0d;box-shadow:0 20px 80px rgba(0,0,0,.4)}
    .brand{font-size:32px;font-weight:900;letter-spacing:.08em;color:#e7bd49}.sub{margin-top:4px;color:#908c83;letter-spacing:.18em;font-size:12px}
    h1{font-size:28px;line-height:1.08;margin:34px 0 12px}.copy{color:#aaa69d;line-height:1.55;font-size:16px}
    .bar{height:8px;background:#24231f;border-radius:999px;overflow:hidden;margin-top:26px}.bar span{display:block;height:100%;width:45%;background:#e7bd49;border-radius:inherit;animation:move 1.1s ease-in-out infinite alternate}
    .small{font-size:13px;color:#77746c;margin-top:16px}@keyframes move{from{transform:translateX(-15%)}to{transform:translateX(135%)}}
  </style>
</head>
<body>
  <main>
    <div class="brand">JUST FUEL</div>
    <div class="sub">FUEL SMART • TRAIN HARD</div>
    <h1>Updating your app…</h1>
    <div class="copy">Removing the retired Just Fuel app shell and loading the current Training, Race and Fuel experience.</div>
    <div class="bar"><span></span></div>
    <div class="small">This should only happen once.</div>
  </main>
  <script>
    (async function resetLegacyPwa(){
      const RESET_ID='20260928a';
      try{
        document.cookie=`jf_current_shell=${RESET_ID}; Path=/; Max-Age=31536000; SameSite=Lax; Secure`;
      }catch{}

      try{
        if('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations){
          const registrations=await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(async registration=>{
            try{registration.waiting?.postMessage('JF_RETIRE_LEGACY')}catch{}
            try{registration.active?.postMessage('JF_RETIRE_LEGACY')}catch{}
            try{return await registration.unregister()}catch{return false}
          }));
        }
      }catch{}

      try{
        if('caches' in window && caches.keys){
          const names=await caches.keys();
          await Promise.all(names.map(name=>caches.delete(name).catch(()=>false)));
        }
      }catch{}

      try{localStorage.removeItem('just-fuel-last-section')}catch{}
      try{sessionStorage.removeItem('jf-open-basket-after-reload')}catch{}

      const target=`/?jfapp=14&legacy=reset&reset_id=${RESET_ID}&t=${Date.now()}`;
      window.location.replace(target);
    })();
  </script>
</body>
</html>
