<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0b" />
  <title>Updating Just Fuel</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080808;color:#f6f1e7;display:grid;place-items:center;padding:28px}
    main{width:min(440px,100%);border:1px solid #4d421f;border-radius:26px;padding:30px;background:#0e0e0d;box-shadow:0 20px 80px rgba(0,0,0,.4)}
    .brand{font-size:32px;font-weight:900;letter-spacing:.08em;color:#e7bd49}.sub{margin-top:4px;color:#908c83;letter-spacing:.18em;font-size:12px}
    h1{font-size:28px;line-height:1.08;margin:34px 0 12px}.copy{color:#aaa69d;line-height:1.55;font-size:16px}
    .bar{height:8px;background:#24231f;border-radius:999px;overflow:hidden;margin-top:26px}.bar span{display:block;height:100%;width:45%;background:#e7bd49;border-radius:inherit;animation:move 1.1s ease-in-out infinite alternate}
    .small{font-size:13px;color:#77746c;margin-top:16px}@keyframes move{from{transform:translateX(-15%)}to{transform:translateX(135%)}}
  </style>
</head>
<body>
  <main>
    <div class="brand">JUST FUEL</div>
    <div class="sub">FUEL SMART • TRAIN HARD</div>
    <h1>Updating your app…</h1>
    <div class="copy">Removing the retired app shell and switching this device to the current Training, Race and Fuel app.</div>
    <div class="bar"><span></span></div>
    <div class="small">Please keep this screen open for a few seconds.</div>
  </main>
  <script>
    (async function forceCurrentShell(){
      const VERSION='15';
      const COOKIE='jf_shell_v15';
      const CURRENT=`/current?jfapp=${VERSION}&legacy=cleared`;
      let finished=false;

      const goCurrent=()=>{
        if(finished) return;
        finished=true;
        window.location.replace(`${CURRENT}&t=${Date.now()}`);
      };

      try{document.cookie=`${COOKIE}=1; Path=/; Max-Age=31536000; SameSite=Lax; Secure`}catch{}
      try{localStorage.removeItem('just-fuel-last-section')}catch{}
      try{sessionStorage.removeItem('jf-open-basket-after-reload')}catch{}

      try{
        if('caches' in window && caches.keys){
          const names=await caches.keys();
          await Promise.all(names.map(name=>caches.delete(name).catch(()=>false)));
        }
      }catch{}

      if(!('serviceWorker' in navigator)){
        goCurrent();
        return;
      }

      // Do NOT unregister the old worker first. A worker can remain in control
      // of an already-open Android PWA window after unregister(). Instead we
      // replace it with the v15 retirement worker, let that worker claim this
      // client, purge caches and navigate every open window to /current.
      try{
        navigator.serviceWorker.addEventListener('controllerchange',()=>{
          setTimeout(goCurrent,150);
        },{once:true});

        const registration=await navigator.serviceWorker.register('/sw.js?retire=15',{
          scope:'/',
          updateViaCache:'none'
        });
        try{await registration.update()}catch{}
        try{registration.waiting?.postMessage('JF_FORCE_ACTIVATE')}catch{}
        try{registration.installing?.postMessage('JF_FORCE_ACTIVATE')}catch{}
      }catch{}

      // Safety fallback. CacheStorage has already been cleared, so even an
      // unusually stubborn older worker cannot serve its old cached index.
      setTimeout(async()=>{
        try{
          if('caches' in window && caches.keys){
            const names=await caches.keys();
            await Promise.all(names.map(name=>caches.delete(name).catch(()=>false)));
          }
        }catch{}
        goCurrent();
      },6500);
    })();
  </script>
</body>
</html>
